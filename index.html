<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https: http:" />
  <title>Mi Browser</title>
  <style>
    :root { --accent: #6c8cff; }
    :root[data-theme="dark"] {
      --bg: #121318; --surface: #1e1f26; --surface2: #2a2c35;
      --text: #eceef3; --muted: #9a9ba6; --border: #33353f;
    }
    :root[data-theme="light"] {
      --bg: #dfe3ea; --surface: #ffffff; --surface2: #eef0f4;
      --text: #1b1d24; --muted: #6a6d78; --border: #d0d4dc;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
                 font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
           stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Pestañas ---------- */
    #tabs { display: flex; align-items: flex-end; gap: 2px; padding: 8px 8px 0; overflow-x: auto;
            scrollbar-width: none; flex-shrink: 0; }
    #tabs::-webkit-scrollbar { display: none; }
    .tab { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; width: 200px; height: 36px;
           padding: 0 8px 0 12px; border-radius: 10px 10px 0 0; cursor: pointer; font-size: 13px;
           color: var(--muted); transition: background .15s; }
    .tab:hover { background: var(--surface2); }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: inset 0 2px 0 var(--accent); }
    .tab .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tab .fav-ico { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; }
    .tab .spinner { display: none; width: 14px; height: 14px; flex-shrink: 0; border-radius: 50%;
                    border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .7s linear infinite; }
    .tab.loading .spinner { display: block; }
    .tab.loading .fav-ico { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tab .close { display: grid; place-items: center; width: 22px; height: 22px; border: none; border-radius: 50%;
                  background: none; color: inherit; cursor: pointer; flex-shrink: 0; }
    .tab .close:hover { background: var(--border); }
    .tab .close .ico { width: 13px; height: 13px; }
    #new-tab { margin-bottom: 4px; }

    /* ---------- Barra de herramientas ---------- */
    #toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: var(--surface); flex-shrink: 0; }
    .icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border: none; border-radius: 50%;
                background: none; color: var(--text); cursor: pointer; flex-shrink: 0; }
    .icon-btn:hover { background: var(--surface2); }
    #fav.on { color: #ffcc4d; }
    #fav.on .ico { fill: #ffcc4d; }
    #url { flex: 1; min-width: 0; height: 36px; padding: 0 16px; font-size: 14px; outline: none; color: var(--text);
           background: var(--surface2); border: 2px solid transparent; border-radius: 18px; }
    #url:focus { border-color: var(--accent); background: var(--surface); }

    /* ---------- Favoritos ---------- */
    #bookmarks { display: flex; gap: 6px; padding: 0 8px 6px; background: var(--surface); overflow-x: auto;
                 scrollbar-width: none; flex-shrink: 0; }
    #bookmarks::-webkit-scrollbar { display: none; }
    #bookmarks:empty { display: none; }
    .bookmark { flex-shrink: 0; max-width: 180px; padding: 4px 12px; border-radius: 14px; font-size: 12px;
                background: var(--surface2); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bookmark:hover { background: var(--border); }

    #views { flex: 1; position: relative; border-top: 1px solid var(--border); background: var(--surface); }
    webview { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
    webview.active { display: flex; }

    /* ---------- Menú ---------- */
    #menu { position: fixed; top: 96px; right: 8px; z-index: 20; width: 240px; padding: 8px; border-radius: 12px;
            background: var(--surface); border: 1px solid var(--border); box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    #menu[hidden] { display: none; }
    .menu-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 12px;
                border: none; border-radius: 8px; background: none; color: var(--text); font-size: 14px; cursor: pointer; }
    .menu-row:hover { background: var(--surface2); }
    .menu-row .kbd { color: var(--muted); font-size: 12px; }
    .menu-label { padding: 8px 12px 2px; font-size: 12px; color: var(--muted); }
    .swatches { display: flex; gap: 10px; padding: 6px 12px 10px; }
    .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
    .swatch.sel { border-color: var(--text); }
    .mobile-only { display: none; }

    /* ---------- Historial ---------- */
    #history-panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 15; width: 380px; max-width: 100%;
                     display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); }
    #history-panel[hidden] { display: none; }
    .hist-head { display: flex; gap: 6px; padding: 8px; background: var(--surface2); }
    .hist-head input { flex: 1; min-width: 0; padding: 8px 14px; border-radius: 16px; outline: none; font-size: 14px;
                       background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .hist-head button { padding: 6px 12px; border: none; border-radius: 8px; background: var(--surface);
                        color: var(--text); cursor: pointer; font-size: 13px; }
    .hist-head button:hover { background: var(--border); }
    #hist-list { flex: 1; overflow-y: auto; }
    .hist-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .hist-item:hover { background: var(--surface2); }
    .hist-item .h-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-item .h-meta { margin-top: 2px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-empty { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ---------- Celular / ventana angosta ---------- */
    @media (max-width: 720px) {
      #tabs { padding: 6px 6px 0; }
      .tab { width: 150px; height: 40px; }
      #toolbar { padding: 6px; }
      .icon-btn { width: 40px; height: 40px; }
      #url { height: 40px; font-size: 16px; border-radius: 20px; }
      #hist-btn { display: none; }
      #menu { top: 102px; right: 6px; }
      #history-panel { width: 100%; border-left: none; }
      .bookmark { padding: 8px 14px; font-size: 13px; }
    }
    @media (max-width: 480px) {
      #forward { display: none; }
      .mobile-only { display: flex; }
    }
  </style>
</head>
<body>
  <div id="tabs">
    <button id="new-tab" class="icon-btn" title="Nueva pestaña (Ctrl+T)">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div id="toolbar">
    <button id="back" class="icon-btn" title="Atrás">
      <svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="forward" class="icon-btn" title="Adelante">
      <svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button id="reload" class="icon-btn" title="Recargar (Ctrl+R)">
      <svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
    <input id="url" type="text" placeholder="Buscá o escribí una dirección" spellcheck="false" autocomplete="off" />
    <button id="fav" class="icon-btn" title="Agregar a favoritos (Ctrl+D)">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>
    </button>
    <button id="hist-btn" class="icon-btn" title="Historial (Ctrl+H)">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </button>
    <button id="menu-btn" class="icon-btn" title="Menú">
      <svg class="ico" viewBox="0 0 24 24" style="fill: currentColor; stroke: none">
        <circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>
      </svg>
    </button>
  </div>

  <div id="bookmarks"></div>
  <div id="views"></div>

  <div id="menu" hidden>
    <button class="menu-row" id="m-theme"><span>Tema</span><span id="theme-label">Oscuro</span></button>
    <div class="menu-label">Color de acento</div>
    <div class="swatches" id="swatches"></div>
    <button class="menu-row" id="m-history"><span>Historial</span><span class="kbd">Ctrl+H</span></button>
    <button class="menu-row mobile-only" id="m-forward"><span>Adelante</span></button>
  </div>

  <div id="history-panel" hidden>
    <div class="hist-head">
      <input id="hist-search" type="text" placeholder="Buscar en el historial" spellcheck="false" />
      <button id="hist-clear" title="Borrar todo el historial">Borrar</button>
      <button id="hist-close" title="Cerrar">✕</button>
    </div>
    <div id="hist-list"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
